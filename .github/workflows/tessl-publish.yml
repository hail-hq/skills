name: Validate and publish skill package

on:
  pull_request:
    paths:
      - skills/**
      - evals/**
      - tessl.json
      - .tessl-plugin/plugin.json
      - README.md
      - LICENSE
      - .github/workflows/tessl-publish.yml
  push:
    branches: [main]
    paths:
      - skills/**
      - evals/**
      - tessl.json
      - .tessl-plugin/plugin.json
      - README.md
      - LICENSE
      - .github/workflows/tessl-publish.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: tesslio/setup-tessl@25ec223fc0da33b41b8044ff5ab2b85235f4f91e # v2
        with:
          version: 0.119.0
      - run: tessl plugin lint .
      - run: tessl skill lint .
      - run: tessl eval lint .
      # Versions are immutable. Change the manifest version in the same PR as
      # packaged content; publishing never commits or pushes to the repository.
      - name: Require a version bump for package changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          manifest = '.tessl-plugin/plugin.json'
          version = json.loads(Path(manifest).read_text())['version']
          def semver(value):
              if not re.fullmatch(r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', value):
                  raise SystemExit('Use a major.minor.patch manifest version.')
              return tuple(map(int, value.split('.')))
          current = semver(version)
          base = os.environ['BASE_SHA']
          previous = subprocess.run(['git', 'show', f'{base}:{manifest}'], capture_output=True, text=True)
          if previous.returncode:
              # The first package manifest has no previously published version.
              exists = subprocess.run(['git', 'cat-file', '-e', base], capture_output=True)
              if exists.returncode:
                  raise SystemExit('Cannot read the PR base commit.')
              raise SystemExit(0)
          changed = subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines()
          packaged = any(p.startswith(('skills/', 'evals/')) or p in (manifest, 'README.md', 'LICENSE', 'tessl.json') for p in changed)
          if packaged and current <= semver(json.loads(previous.stdout)['version']):
              raise SystemExit('Bump .tessl-plugin/plugin.json version when packaged content changes.')
          PY

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check publishing credentials and source identity
        env:
          TESSL_TOKEN: ${{ secrets.TESSL_TOKEN }}
        run: |
          test -n "$TESSL_TOKEN" || { echo '::error::Configure the TESSL_TOKEN repository secret with a publisher workspace API key.'; exit 1; }
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL" || { echo '::error::GitHub identity is required to link this package to its source repository.'; exit 1; }
      - uses: tesslio/setup-tessl@25ec223fc0da33b41b8044ff5ab2b85235f4f91e # v2
        with:
          version: 0.119.0
          token: ${{ secrets.TESSL_TOKEN }}
      - name: Check the exact registry version
        id: registry
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          package = json.loads(Path('.tessl-plugin/plugin.json').read_text())
          name, version = package['name'], package['version']
          result = subprocess.run(['tessl', 'plugin', 'info', f'{name}@{version}', '--json'], capture_output=True, text=True)
          if result.returncode == 0:
              published = json.loads(result.stdout)['version']
              if published['version'] != version:
                  raise SystemExit('Registry returned a different version.')
              if published.get('archived') or published.get('moderationPassed') is not True:
                  raise SystemExit('This version already exists but is not approved and active. Inspect its publication status before retrying.')
              exists = True
              print(f'{name}@{version} is already published; skipping upload.')
          else:
              # Match only the pinned CLI's two verified not-found messages.
              # Other errors, including auth and transport failures, stop the job.
              lines = result.stderr.strip().splitlines()
              message = lines[0].removeprefix('✘ ') if lines else ''
              missing = {f'Could not find plugin "{name}".', f'Plugin "{name}" exists, but it has no version "{version}".'}
              if message not in missing:
                  sys.stderr.write(result.stderr or result.stdout)
                  raise SystemExit(result.returncode)
              exists = False
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'exists={str(exists).lower()}\n')
          PY
      - name: Publish to the manifest's workspace
        if: steps.registry.outputs.exists != 'true'
        run: |
          WORKSPACE="$(python3 -c 'import json; print(json.load(open(".tessl-plugin/plugin.json"))["name"].split("/")[0])')"
          # Start the approved evaluation separately so publication success
          # cannot hide a scenario-upload or evaluation-start failure.
          tessl plugin publish . --workspace "$WORKSPACE" --skip-evals
      - name: Run the approved one-off registry evaluation
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          def read_json(*args):
              return json.loads(subprocess.check_output(['tessl', *args], text=True))
          package = json.loads(Path('.tessl-plugin/plugin.json').read_text())
          # Only this approved release runs evaluations. All other versions skip.
          if package['version'] != '0.1.3':
              raise SystemExit(0)
          if package['name'] != 'hail-hq/hail':
              raise SystemExit('One-off evaluation approval covers hail-hq/hail@0.1.3 only.')
          workspace, _ = package['name'].split('/')
          def registry_run(run_id):
              attributes = read_json('eval', 'view', run_id, '--json')['data']['attributes']
              context = attributes.get('evalRunFixtures', {}).get('context', {}).get('definition', {})
              expected = {'type': 'plugin', 'name': package['name'], 'version': package['version']}
              if any(context.get(key) != value for key, value in expected.items()):
                  return None
              return attributes
          def report(run_id):
              url = f'https://tessl.io/workspaces/{workspace}/eval-runs/{run_id}'
              print(f'Registry evaluation: {url}')
              if os.environ.get('GITHUB_STEP_SUMMARY'):
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
                      output.write(f'Registry evaluation: [{run_id}]({url})\n')
          # A rerun reuses an existing registry-linked run, including one whose
          # creation succeeded before a transient workflow failure.
          runs = read_json('eval', 'list', '--workspace', workspace, '--plugin', 'hail', '--context-type', 'plugin', '--limit', '100', '--json')
          for item in runs['data']:
              existing = registry_run(item['id'])
              if existing is not None:
                  report(item['id'])
                  if existing.get('status') not in ('pending', 'completed'):
                      raise SystemExit('The existing evaluation failed. Inspect its report; retry requires owner approval.')
                  raise SystemExit(0)
          if runs.get('links', {}).get('next'):
              raise SystemExit('Evaluation history is incomplete. Inspect older runs before starting another.')
          # Verified billing owner of hail-hq and its skills project. Select it
          # explicitly; never infer the organization from the active CLI user.
          org = '01a1c5bb-5698-7721-aa35-7a0ce34de060'
          projects = read_json('project', 'list', '--org', org, '--json')['projects']
          if not any(p['id'] == '01a1caac-3d56-7447-990f-a4707b933a93' and p['workspaceId'] == '01a1c62b-f956-70cb-8764-3d50bc2eb360' and p['sourceUri'] == 'github.com/hail-hq/skills' for p in projects):
              raise SystemExit('Cannot confirm the evaluation project belongs to the approved billing organization.')
          usage = read_json('org', 'usage', '--org', org, '--json')
          credits = usage['credits']
          if usage['plan']['code'] != 'free' or credits.get('overageAllowed') is not False:
              raise SystemExit('One-off evaluations require the Free plan with cash overage disabled.')
          if credits.get('overLimit') is not False or credits.get('remaining', 0) <= 0:
              raise SystemExit('No available free credits. No evaluation was started.')
          created = read_json('eval', 'run', './evals', '--context', 'hail-hq/hail@0.1.3', '--quality-check', '--json', '--no-wait')
          if len(created) != 1 or not created[0].get('evalRunId'):
              raise SystemExit('Tessl did not return one evaluation run ID. Inspect the run list before retrying.')
          run_id = created[0]['evalRunId']
          started = registry_run(run_id)
          if started is None or started.get('status') not in ('pending', 'completed'):
              raise SystemExit(f'Tessl did not confirm a registry-linked evaluation: {run_id}. Inspect it before retrying.')
          report(run_id)
          PYTHON
      - name: Report the exact package version
        run: |
          PACKAGE="$(python3 -c 'import json; p=json.load(open(".tessl-plugin/plugin.json")); print(p["name"] + "@" + p["version"])')"
          tessl plugin info "$PACKAGE"
